[project]
name = "qrp-duckdb"
version = "0.1.0"
description = "Sentinel QRP Type 2 — DuckDB implementation"
readme = "README.md"
requires-python = ">=3.10"
# Deliberately one runtime dependency. Everything else is an extra, so a
# site can install the minimum reviewable surface. See docs/SECURITY.md.
# 1.5 is the real floor, not 1.1. The pipeline uses SEMI JOIN,
# GROUP BY ALL, QUALIFY, ASOF JOIN, duckdb_memory() and
# query_progress(), and the lockfile pins 1.5.5 — so `pip install .`
# could resolve 1.1.x and fail at runtime on SQL the tests never
# exercised against it. Reported in review.
dependencies = ["duckdb>=1.5,<2"]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: SQL",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2", "mypy>=1.8", "ruff>=0.6"]
ui = ["textual>=0.80"]
serve = ["textual>=0.80", "textual-serve>=1.1"]

[project.scripts]
qrp = "qrp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The suite runs the full pipeline many times over real-sized fixtures,
# so it takes roughly ten minutes. Slices that each finish in ~2 min:
#   -k "rewrite or stockpil or washout or age or enrollment or normalize
#       or episode or determin or memory or security or error or exit"
#   -k "dose or care_setting or eventcount or fupwash or blackout or ioc
#       or code_distribution or code_lists or distindexmap"
#   -k "scdm or layout or naming or table_map or fingerprint or column
#       or lab or every_feature or manifest"
#   -k "inclusion or subcond or condlevel or minrxdays or iev or eev
#       or anchor or separate_conds or codedays"
#   -k "thread_count or risk or geography or cida or denominator
#       or utilization or attrition or person_time or invariant"
markers = ["slow: runs the pipeline end to end"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Not strict mode. The remaining errors are all third-party stub
# imprecision — DuckDB types `.description` and `.fetchone()` as
# Optional even where a preceding query guarantees a result, and
# Textual's `query_one` returns the base Widget. Enabling strict would
# bury the ~10 real findings this configuration catches under ~200 that
# say nothing.
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["duckdb.*", "textual.*", "textual_serve.*"]
ignore_errors = true
